<!DOCTYPE html>

    <title>Barnaby "Buster" Bark-Waggen | Official Site</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths back to index.html with query/hash intact
      sessionStorage.redirect = location.href;
      window.location.replace(
        location.pathname.split('/').slice(0, 1 + (location.pathname.match(/\//g) || []).length - 1).join('/') + '/'
      );
    </script>
