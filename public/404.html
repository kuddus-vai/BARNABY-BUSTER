<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Barnaby "Buster" Bark-Waggen | Official Site</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 paths back to index.html with query/hash intact
      var path = location.pathname;
      var repoBase = path.split('/').slice(0, 1 + (path.match(/\//g) || []).length - 1).join('/') + '/';
      if (path.toLowerCase().endsWith('/kuddus')) {
        window.location.replace(repoBase + '#/kuddus');
      } else {
        sessionStorage.redirect = location.href;
        window.location.replace(repoBase);
      }
    </script>
  </head>
  <body style="background:#121212;color:#FFCC00;font-family:sans-serif;text-align:center;padding:50px;">
    <h2>Redirecting to Buster's Official HQ...</h2>
    <p><a href="./" style="color:#00FFFF;">Click here if you are not redirected automatically.</a></p>
  </body>
</html>
