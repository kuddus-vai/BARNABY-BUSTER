    <!-- GitHub Pages Relative Path & 404 Redirect Resolver -->
    <script>
      (function() {
        // 1. Ensure trailing slash for repository GitHub Pages so relative assets './assets/...' always resolve correctly
        var p = window.location.pathname;
        if (p && !p.endsWith('/') && !p.split('/').pop().includes('.')) {
          var targetUrl = window.location.protocol + '//' + window.location.host + p + '/' + window.location.search + window.location.hash;
          window.location.replace(targetUrl);
          return;
        }

        // 2. Restore SPA path if redirected from 404.html
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
